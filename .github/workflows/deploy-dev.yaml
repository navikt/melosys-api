name: deploy-dev
on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENCE"
      - "CODEOWNERS"
    branches:
      - master
permissions:
    contents: write
    packages: write
    id-token: write
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PASSWORD: ${{ secrets.READER_TOKEN }}
  REGISTRY: ghcr.io
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest-8-cores
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      telemetry: ${{ steps.docker-push.outputs.telemetry }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.READER_TOKEN }}
      - name: Build and test
        run: mvn clean package --threads=8 -B -e -U --settings .github/settings.xml
      - name: Build and publish Docker images (multi-arch)
        id: docker-push
        uses: nais/docker-build-push@v0
        with:
          team: teammelosys
          tag: |
              type=raw,value=latest,priority=9001
              type=raw,value=${{ github.sha }},priority=9000
          platforms: linux/amd64,linux/arm64
          salsa: true

  deploy:
    runs-on: ubuntu-latest-8-cores
    needs: build
    steps:
      - name: Checkout latest code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: pre-deploy
        uses: navikt/digihot-deploy/actions/pre-deploy@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: deploy new Unleash Apikey to ${{github.event.inputs.environment}}
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-fss
          RESOURCE: nais/unleash-apitoken.yml
          VARS: nais/vars-q2.json
      - name: Deploy til dev (Q2)
        id: deploy-q2
        uses: nais/deploy/actions/deploy@v2
        continue-on-error: true
        env:
          CLUSTER: dev-fss
          RESOURCE: nais/nais.yml
          IMAGE: ${{ needs.build.outputs.image }}
          VARS: nais/vars-q2.json
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
      - name: Deploy Unleash Apikey to q1
        if: steps.deploy-q2.outcome == 'success'
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-fss
          RESOURCE: nais/unleash-apitoken.yml
          VARS: nais/vars-q1.json
      - name: Deploy til dev (Q1)
        id: deploy-q1
        if: steps.deploy-q2.outcome == 'success'
        uses: nais/deploy/actions/deploy@v2
        continue-on-error: true
        env:
          CLUSTER: dev-fss
          RESOURCE: nais/nais.yml
          IMAGE: ${{ needs.build.outputs.image }}
          VARS: nais/vars-q1.json
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
      - name: Set deployment status
        id: deployment-check
        run: |
          if [ "${{ steps.deploy-q2.outcome }}" != "success" ]; then
            echo "Q2 deployment failed"
            exit 1
          elif [ "${{ steps.deploy-q1.outcome }}" != "success" ]; then
            echo "Q1 deployment failed"
            exit 1
          fi
      - name: Get commit message
        run: echo "COMMIT_MSG=$(git log --format=%s -n 1)" >> $GITHUB_ENV
      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: "${{ steps.deployment-check.outcome == 'success' && 'good' || 'danger' }}"
          SLACK_USERNAME: Github Actions
          SLACK_ICON: https://github.com/github.png?size=48
          SLACK_TITLE: "melosys-api ${{ steps.deployment-check.outcome == 'success' && 'ble deployet' || 'kunne ikke deployes' }} til q1 og q2"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_MESSAGE: ${{ env.COMMIT_MSG }}
      - name: post-deploy
        if: steps.deployment-check.outcome == 'success'
        uses: navikt/digihot-deploy/actions/post-deploy@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: draft release
        if: steps.deployment-check.outcome == 'success'
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.APPLICATION }} ${{ env.VERSION_TAG }}
          body: ${{ env.CHANGE_LOG }}
          draft: true
          prerelease: false

  # Har en label-kjøring (e2e-pr.yml) eller merge queue alt testet nøyaktig denne
  # koden grønt, finnes markøren e2e-ok-<tree>, og e2e-dispatch hoppes over.
  # Jobben feiler aldri: enhver feil gir hit=false, og da kjører e2e som før.
  e2e-marker:
    name: Slå opp e2e-markør
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      hit: ${{ steps.marker.outputs.hit }}
    steps:
      - name: Login to NAIS registry
        uses: nais/login@v0
        continue-on-error: true
        with:
          team: teammelosys
      - name: Finnes e2e-ok-<tree>?
        id: marker
        env:
          IMAGE: europe-north1-docker.pkg.dev/nais-management-233d/teammelosys/melosys-api
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          if [[ "$TREE" =~ ^[0-9a-f]{40}$ ]] && docker manifest inspect "$IMAGE:e2e-ok-$TREE" > /dev/null 2>&1; then
            hit=true
          else
            hit=false
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
          echo "e2e-marker: hit=$hit (tree ${TREE:-ukjent})" | tee -a "$GITHUB_STEP_SUMMARY"

  trigger-e2e-tests:
    name: Trigger E2E tests
    runs-on: ubuntu-latest
    needs: [ build, deploy, e2e-marker ]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.deploy.result == 'success' && needs.e2e-marker.outputs.hit != 'true' }}
    steps:
        -   name: Checkout latest code
            uses: actions/checkout@v7.0.1
        -   name: Get commit message
            run: echo "COMMIT_MSG=$(git log --format=%s -n 1)" >> $GITHUB_ENV
        -   name: Trigger E2E tests in melosys-e2e-tests
            uses: peter-evans/repository-dispatch@v4
            with:
                token: ${{ secrets.E2E_TRIGGER_PAT }}
                repository: navikt/melosys-e2e-tests
                event-type: melosys-api-published
                client-payload: |
                    {
                      "repository": "melosys-api",
                      "image_tag": "${{ github.sha }}",
                      "commit_sha": "${{ github.sha }}",
                      "commit_message": ${{ toJSON(env.COMMIT_MSG) }},
                      "actor": "${{ github.actor }}"
                    }
