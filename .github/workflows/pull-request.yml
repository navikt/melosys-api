name: Maven Test

# Unit-testene og integrasjonstestene kjører i hver sin jobb på standard runner. Branch
# protection krever sjekkene «Unit Tests» og «Integration Tests»; det er samlejobbene nederst,
# som feiler når en testjobb feilet eller ingen tester kjørte.
# Plan: melosys-kode-wiki plans/2026-10-31-melosys-api-ci-sharding.mdx

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  packages: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PASSWORD: ${{ secrets.READER_TOKEN }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
      # Alle *Test-klasser, og ArchUnit-testen, som er en *IT uten Docker. Failsafe i
      # integrasjonstest finner ingen klasse som matcher, og starter ingen containere.
      - name: Build and test
        run: >-
          mvn clean verify --threads=4 -B -e -U --settings .github/settings.xml
          -Dit.test=ArkitekturTestIT -Dfailsafe.failIfNoSpecifiedTests=false

      - name: Upload test reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports
          overwrite: true
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml

      # Kommenterer i PR-en, så den trenger en PR. Merge queue har ingen.
      - name: Code Coverage Report
        uses: madrapps/jacoco-report@v1.8.0
        if: (success() || failure()) && github.event_name == 'pull_request'
        with:
          paths: '**/target/site/jacoco/jacoco.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: '📊 Code Coverage'
          update-comment: true

      - name: Module Coverage Summary
        if: success() || failure()
        run: |
          echo "## 📊 Coverage per Module" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Lines | Branches |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|----------|" >> $GITHUB_STEP_SUMMARY

          total_line_covered=0
          total_line_missed=0
          total_branch_covered=0
          total_branch_missed=0

          for csv_file in */target/site/jacoco/jacoco.csv; do
            if [ -f "$csv_file" ]; then
              module=$(dirname $(dirname $(dirname $(dirname "$csv_file"))))

              line_covered=$(awk -F',' 'NR>1 {sum+=$9} END {print sum+0}' "$csv_file")
              line_missed=$(awk -F',' 'NR>1 {sum+=$8} END {print sum+0}' "$csv_file")
              branch_covered=$(awk -F',' 'NR>1 {sum+=$7} END {print sum+0}' "$csv_file")
              branch_missed=$(awk -F',' 'NR>1 {sum+=$6} END {print sum+0}' "$csv_file")

              if [ $((line_covered + line_missed)) -gt 0 ]; then
                line_pct=$(awk "BEGIN {printf \"%.1f\", ($line_covered / ($line_covered + $line_missed)) * 100}")
              else
                line_pct="N/A"
              fi

              if [ $((branch_covered + branch_missed)) -gt 0 ]; then
                branch_pct=$(awk "BEGIN {printf \"%.1f\", ($branch_covered / ($branch_covered + $branch_missed)) * 100}")
              else
                branch_pct="N/A"
              fi

              echo "| $module | ${line_pct}% | ${branch_pct}% |" >> $GITHUB_STEP_SUMMARY

              total_line_covered=$((total_line_covered + line_covered))
              total_line_missed=$((total_line_missed + line_missed))
              total_branch_covered=$((total_branch_covered + branch_covered))
              total_branch_missed=$((total_branch_missed + branch_missed))
            fi
          done

          if [ $((total_line_covered + total_line_missed)) -gt 0 ]; then
            total_line_pct=$(awk "BEGIN {printf \"%.1f\", ($total_line_covered / ($total_line_covered + $total_line_missed)) * 100}")
            total_branch_pct=$(awk "BEGIN {printf \"%.1f\", ($total_branch_covered / ($total_branch_covered + $total_branch_missed)) * 100}")
            echo "| **TOTAL** | **${total_line_pct}%** | **${total_branch_pct}%** |" >> $GITHUB_STEP_SUMMARY
          fi

  # Ikke «Integration Tests»: det navnet har samlejobben, som branch protection krever.
  it-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'
      # Mock-imaget til Testcontainers ligger i GAR, Oracle-imaget i ghcr.
      - name: Authenticate with Google Artifact Registry
        uses: nais/login@v0
        with:
          team: teammelosys
      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.READER_TOKEN }}
      # -Dtest=Ingen slår av surefire; -Dsurefire.skip=true gjør ikke det.
      - name: Integration tests
        run: >-
          mvn clean verify -pl integrasjonstest -am --threads=4 -B -e -U --settings .github/settings.xml
          -Dtest=Ingen -Dsurefire.failIfNoSpecifiedTests=false

      # Rapportene ligger i en mappe med shardets navn inne i artefaktet, så samlejobben ser
      # hvilket shard en klasse kjørte i, også når bare ett shard har lastet opp.
      - name: Collect test reports
        if: success() || failure()
        env:
          SHARD_MAPPE: shard-reports/it-reports-shard-${{ matrix.shard }}
        run: |
          mkdir -p "$SHARD_MAPPE"
          find integrasjonstest/target/failsafe-reports -name 'TEST-*.xml' -exec cp {} "$SHARD_MAPPE" \; 2>/dev/null || true
      - name: Upload test reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: it-reports-shard-${{ matrix.shard }}
          overwrite: true
          path: shard-reports/

  unit-tests:
    name: Unit Tests
    needs: unit
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download test reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: unit-reports
          path: unit-reports
      - name: Test report
        uses: mikepenz/action-junit-report@v6.6.1
        with:
          annotate_only: true
          require_tests: true
          fail_on_failure: true
          report_paths: 'unit-reports/**/TEST-*.xml'
      - name: Result of the unit job
        env:
          UNIT: ${{ needs.unit.result }}
        run: |
          if [ "$UNIT" != "success" ]; then
            echo "::error::Unit-jobben endte med $UNIT."
            exit 1
          fi

  integration-tests:
    name: Integration Tests
    needs: it-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      # Hvert artefakt har sin shard-mappe inne i seg, så de kan pakkes ut i samme mappe.
      - name: Download test reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: it-reports-shard-*
          merge-multiple: true
          path: it-reports
      - name: Test the report script
        run: node --test .github/scripts/it-rapport.test.mjs
      - name: Test report
        uses: mikepenz/action-junit-report@v6.6.1
        with:
          annotate_only: true
          require_tests: true
          fail_on_failure: true
          report_paths: 'it-reports/**/TEST-*.xml'
      - name: Every IT class in exactly one shard
        if: success() || failure()
        run: |
          mkdir -p it-reports
          node .github/scripts/it-rapport.mjs integrasjonstest/src/test it-reports it-timings.json
      # Tidene per klasse, som fordelingen på shards leser i neste kjøring.
      - name: Upload timings
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: it-timings
          overwrite: true
          path: it-timings.json
      - name: Result of the shards
        if: success() || failure()
        env:
          SHARDS: ${{ needs.it-shard.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "::error::IT-shardene endte med $SHARDS."
            exit 1
          fi
