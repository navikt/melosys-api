name: Build and Push Image
run-name: Build and Push Image · ${{ inputs.image_tag }}
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom image tag (e.g., e2e-test-123, feature-x; latest, mq-* and e2e-ok-* are reserved)'
        required: true
        type: string
      skip_tests:
        description: 'Skip tests for faster build'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PASSWORD: ${{ secrets.READER_TOKEN }}
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 30
    outputs:
      image: ${{ steps.docker-push.outputs.image }}
      custom_tag: ${{ github.event.inputs.image_tag }}
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Use a valid Docker tag: 1-128 letters, digits, underscores, periods or hyphens, starting with a letter, digit or underscore."
            exit 1
          fi
          # Reserved: latest (the shared default image), mq-* (merge queue images)
          # and e2e-ok-* (the e2e marker; a manual e2e-ok-<tree> would make e2e skip that code).
          case "$IMAGE_TAG" in
            latest | mq-* | e2e-ok-*)
              echo "::error::The tag $IMAGE_TAG is reserved (latest, mq-* and e2e-ok-*). Use another tag."
              exit 1
              ;;
          esac
          # A 40-character commit sha is the image of that commit, so only this run's own sha.
          if [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ && "$IMAGE_TAG" != "$GITHUB_SHA" ]]; then
            echo "::error::The tag $IMAGE_TAG is the sha of another commit and reserved for its image. Use another tag."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Maven
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.READER_TOKEN }}

      - name: Build and test
        run: mvn clean package --threads=8 ${{ github.event.inputs.skip_tests == 'true' && '-DskipTests' || '' }} -B -e -U --settings .github/settings.xml

      - name: Build and publish Docker images (multi-arch)
        id: docker-push
        uses: nais/docker-build-push@v0
        with:
          team: teammelosys
          tag: |
            type=raw,value=${{ github.event.inputs.image_tag }},priority=9001
            type=raw,value=${{ github.sha }},priority=9000
          platforms: linux/amd64,linux/arm64
          salsa: true

      - name: Output image info
        run: |
          echo "✅ Image built and pushed successfully!"
          echo "📦 Image: ${{ steps.docker-push.outputs.image }}"
          echo "🏷️  Custom tag: ${{ github.event.inputs.image_tag }}"
          echo "🏷️  SHA tag: ${{ github.sha }}"
          echo ""
          echo "To use in e2e tests, reference: europe-north1-docker.pkg.dev/nais-management-233d/teammelosys/melosys-api:${{ github.event.inputs.image_tag }}"
